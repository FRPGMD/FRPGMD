#Mallard Guard config format revision.
# Default: 130
# Range: > 0
configRevision = 105

[debug]
	#Local diagnostic flags, set from the Diagnostics page. 16384 is the master switch; without it nothing is logged.
	# Default: 0
	# Range: 0 ~ 32767
	logging = 0

[display]
	#Brightness of the captured impact image; adjust inside the live preview.
	# Default: 400
	# Range: 0 ~ 400
	impactBrightness = 400
	#Camera shake strength after a regular parry.
	# Default: 65
	# Range: 0 ~ 100
	regularShakeStrength = 55
	#Brightness of the regular-parry flash.
	# Default: 10
	# Range: 0 ~ 100
	regularFlashIntensity = 82
	#Horizontal position of the shield icon.
	# Default: 5000
	# Range: 0 ~ 10000
	iconX = 5000
	#Show this part of the icon animation.
	# Default: 1
	# Range: 0 ~ 1
	icon4Component0 = 1
	#Only perfect parries shake the camera.
	# Default: 0
	# Range: 0 ~ 1
	shakePerfectOnly = 0
	#Show this part of the icon animation.
	# Default: 1
	# Range: 0 ~ 1
	icon4Component2 = 1
	#A brief grayscale flash lasting as long as the configured hitlag.
	# Default: 0
	# Range: 0 ~ 1
	impactFrames = 0
	#Show this part of the icon animation.
	# Default: 1
	# Range: 0 ~ 1
	icon1Component2 = 1
	#Show this part of the icon animation.
	# Default: 1
	# Range: 0 ~ 1
	icon1Component1 = 1
	#Size of the shield icon and its reactions.
	# Default: 90
	# Range: 50 ~ 200
	iconSize = 100
	#Independent brightness when a mob perfectly parries you; used with Adapt off.
	# Default: 186
	# Range: 0 ~ 400
	mobImpactBrightness = 186
	#Show this part of the icon animation.
	# Default: 1
	# Range: 0 ~ 1
	icon1Component3 = 1
	#Invert the impact image colors.
	# Default: 0
	# Range: 0 ~ 1
	playerImpactInvert = 0
	#Show this part of the icon animation.
	# Default: 0
	# Range: 0 ~ 1
	icon1Component0 = 0
	#Briefly freeze your view on a parry impact.
	# Default: 1
	# Range: 0 ~ 1
	hitlagEnabled = 1
	#Independent mob impact grain, with Adapt off.
	# Default: 101
	# Range: 0 ~ 400
	mobImpactGrain = 101
	#When on, the ordinary white screen flash occurs only on perfect parries. Meme flash still shows a white flash for either parry.
	perfectOnlyFlash = true
	#Space between the icon and nearby HUD elements or screen edges.
	# Default: 6
	# Range: 0 ~ 80
	iconGap = 6
	#Show this part of the icon animation.
	# Default: 1
	# Range: 0 ~ 1
	icon2Component1 = 1
	#Show this part of the icon animation.
	# Default: 0
	# Range: 0 ~ 1
	icon2Component0 = 0
	#Show this part of the icon animation.
	# Default: 1
	# Range: 0 ~ 1
	icon2Component3 = 1
	#Show this part of the icon animation.
	# Default: 1
	# Range: 0 ~ 1
	icon2Component2 = 1
	#Perfect-parry camera shake lifetime. 0 disables it.
	# Default: 12
	# Range: 0 ~ 40
	perfectShakeTicks = 6
	#Fine roughness in the captured impact image; adjust inside the live preview.
	# Default: 400
	# Range: 0 ~ 400
	impactGrain = 400
	#Animated RGB separation after parries. Smoothly expands and settles. 0 disables it.
	# Default: 200
	# Range: 0 ~ 200
	chromaticIntensity = 200
	#Position of the shield icon.
	# Default: 6
	# Range: 0 ~ 9
	iconAnchor = 6
	#Show one of four full-screen meme images alongside a local meme clip. Both start with the white parry flash after hitlag; the image holds 0.5 seconds and fades over 0.2 seconds. Blocks never trigger it.
	memeFlash = false
	#Invert the mob impact image, independently of Adapt.
	mobImpactInvert = true
	#Shake your view after a parry.
	# Default: 1
	# Range: 0 ~ 1
	cameraShakeEnabled = 1
	#Perfect parry local freeze duration in ticks. 20 ticks = one second. Impact Frame occurs inside this freeze; 0 disables hitlag.
	# Default: 3
	# Range: 0 ~ 30
	hitlagTicks = 3
	#Show this part of the icon animation.
	# Default: 1
	# Range: 0 ~ 1
	icon3Component3 = 1
	#Show this part of the icon animation.
	# Default: 1
	# Range: 0 ~ 1
	icon3Component1 = 1
	#Duration of animated RGB separation; changing duration also changes animation speed.
	# Default: 8
	# Range: 1 ~ 40
	chromaticTicks = 6
	#Show this part of the icon animation.
	# Default: 1
	# Range: 0 ~ 1
	icon3Component2 = 1
	#Animate the guard icon: a ready outline and parry flashes. Tool blocks flash red, shield blocks emit a short white echo, and the darker icon trembles with repeating echoes while held.
	shieldEffects = true
	#Regular parry freeze duration, in ticks.
	#Used when Perfect Only is disabled. 0 disables regular hitlag and impact feedback.
	# Default: 1
	# Range: 0 ~ 30
	regularHitlagTicks = 1
	#Show this part of the icon animation.
	# Default: 1
	# Range: 0 ~ 1
	icon3Component0 = 1
	#Regular-parry camera shake lifetime. 0 disables it.
	# Default: 8
	# Range: 0 ~ 40
	regularShakeTicks = 6
	#Add a colored fringe around the edges of your view.
	# Default: 1
	# Range: 0 ~ 1
	chromaticEnabled = 1
	#Only perfect parries freeze your view.
	# Default: 0
	# Range: 0 ~ 1
	hitlagPerfectOnly = 0
	#When enabled, only perfect parries show the grayscale impact image. Regular parries skip it.
	impactPerfectOnly = true
	#Mob impact images follow your own impact settings. Turn off to customize them independently.
	mobImpactAdapt = true
	#Independent mob impact edge strength, with Adapt off.
	# Default: 200
	# Range: 0 ~ 400
	mobImpactEdges = 200
	#Independent mob impact RGB separation, with Adapt off.
	# Default: 30
	# Range: 0 ~ 400
	mobImpactChromatic = 30
	#Perfect-parry camera shake strength. 0 disables motion. Regular strength has its own setting.
	# Default: 85
	# Range: 0 ~ 100
	shakeStrength = 100
	#Strength of the brief screen flash, as a percentage. 0 disables it.
	# Default: 10
	# Range: 0 ~ 100
	flashStrength = 100
	#Only perfect parries trigger animated RGB separation when enabled. Off applies it to both parry types.
	chromaticPerfectOnly = false
	#Brief white screen flash after parries. Meme flash always uses a full white flash. Blocks never flash.
	screenFlash = false
	#How long regular-parry color separation lasts.
	# Default: 4
	# Range: 1 ~ 40
	regularChromaticTicks = 6
	#Contrast of the captured impact image; adjust inside the live preview.
	# Default: 350
	# Range: 0 ~ 400
	impactContrast = 200
	#Show the parry shield at its configured HUD position.
	hud = true
	#Vertical position of the shield icon.
	# Default: 5000
	# Range: 0 ~ 10000
	iconY = 5000
	#Independent mob impact contrast, with Adapt off.
	# Default: 110
	# Range: 0 ~ 400
	mobImpactContrast = 110
	#Show this part of the icon animation.
	# Default: 0
	# Range: 0 ~ 1
	icon0Component0 = 0
	#Darkening of edges in the captured impact image; adjust inside the live preview.
	# Default: 400
	# Range: 0 ~ 400
	impactEdges = 400
	#RGB channel separation in your still impact image. 0 disables it. Adjust in the preview.
	# Default: 400
	# Range: 0 ~ 400
	impactChromatic = 400
	#Show this part of the icon animation.
	# Default: 1
	# Range: 0 ~ 1
	icon0Component1 = 1
	#Show this part of the icon animation.
	# Default: 1
	# Range: 0 ~ 1
	icon0Component2 = 1
	#Also separate HUD color channels. Off processes the world view before HUD drawing.
	chromaticHud = true
	#Strength of the shield icon's expansion, shake, highlight and echo.
	# Default: 100
	# Range: 0 ~ 200
	hudStrength = 100

	[display.stunEcho]
		#Show afterimages around stunned entities.
		# Default: 1
		# Range: 0 ~ 1
		enabled = 1
		#How long the afterimage lasts, up to the stun duration.
		# Default: 8
		# Range: 0 ~ 200
		ticks = 8
		#Visibility of the stun afterimage.
		# Default: 45
		# Range: 0 ~ 100
		opacity = 45
		#How far the afterimage spreads from the entity.
		# Default: 25
		# Range: 0 ~ 200
		expansion = 25

[audio]
	#Your playback volume for regular parries and regular fall parries and their meme clip; multiplied by the master level.
	# Default: 65
	# Range: 0 ~ 200
	parryVolume = 65
	#Your own master playback level for Mallard Guard sounds, including the meme clip. 100% is the recorded level before other volume settings; 0% mutes it. Levels above 100% use a louder recording where available.
	# Default: 100
	# Range: 0 ~ 200
	masterVolume = 100
	#Your playback volume for blocks and regular shield parries; multiplied by the master level.
	# Default: 65
	# Range: 0 ~ 200
	blockVolume = 65
	#Your playback volume for perfect parries, including shield and enabled perfect fall parries, and their meme clip; multiplied by the master level.
	# Default: 130
	# Range: 0 ~ 200
	perfectVolume = 130

[particles]
	#Favor forward sparks on shield parries.
	# Default: 1
	# Range: 0 ~ 1
	shieldForwardBias = 1
	#Amount of sparks, debris and tracers. Perfect parries add 20%.
	# Default: 100
	# Range: 0 ~ 300
	intensity = 100

	[particles.centerImpact]
		#How long the impact animation lasts. Longer plays more slowly.
		# Default: 8
		# Range: 1 ~ 40
		durationTicks = 8
		#Size of the animated impact flash.
		# Default: 200
		# Range: 0 ~ 400
		size = 250
		#Visibility of the impact flash.
		# Default: 100
		# Range: 0 ~ 100
		opacity = 100
		#Show this particle effect.
		# Default: 1
		# Range: 0 ~ 1
		enabled = 1
		#How fast the impact flash spins.
		# Default: 45
		# Range: 0 ~ 720
		spinSpeed = 45

	[particles.shootingSparks]
		#Base amount. 100% produces 100 tracer heads; 0% disables Spark Tracers completely.
		# Default: 6
		# Range: 0 ~ 100
		baseIntensity = 6
		#Middle color of tracers and the impact flash.
		# Default: 16753995
		# Range: 0 ~ 16777215
		middleColor = 16777215
		#Particle size. Zero hides this particle type.
		# Default: 125
		# Range: 0 ~ 400
		overallSize = 125
		#Final color of tracers and the impact flash.
		# Default: 8816262
		# Range: 0 ~ 16777215
		endColor = 16777215
		#How long particles last.
		# Default: 8
		# Range: 1 ~ 80
		lifetimeTicks = 12
		#Increase amount per damage point: 10% × 5 damage adds 50%. 0% adds nothing. All particles share burst and active head caps.
		# Default: 2
		# Range: 0 ~ 100
		damageScaling = 2
		#How long tracer tails last.
		# Default: 4
		# Range: 1 ~ 4
		trailTicks = 2
		#Show this particle effect.
		# Default: 1
		# Range: 0 ~ 1
		enabled = 1
		#Starting color of tracers and the impact flash.
		# Default: 16766900
		# Range: 0 ~ 16777215
		startColor = 16777215

	[particles.flyingSparks]
		#Regular-parry spark amount as a percentage of 100 sparks. Zero disables regular-parry sparks. Electric and animated appearances share this amount.
		# Default: 6
		# Range: 0 ~ 100
		baseIntensity = 6
		#Particle size. Zero hides this particle type.
		# Default: 80
		# Range: 0 ~ 400
		size = 80
		#How long particles last.
		# Default: 20
		# Range: 1 ~ 80
		lifetimeTicks = 20
		#Extra percentage of the selected amount per intercepted damage point. Zero disables damage scaling. Counts are capped at 512 per burst; projectile hits use an estimate when exact damage is unavailable.
		# Default: 2
		# Range: 0 ~ 100
		damageScaling = 2
		#How much spark sizes vary. Zero gives them all the same size.
		# Default: 50
		# Range: 0 ~ 100
		sizeVariance = 50
		#Color of flying sparks.
		# Default: 16777215
		# Range: 0 ~ 16777215
		baseColor = 16777215
		#Show this particle effect.
		# Default: 0
		# Range: 0 ~ 1
		enabled = 1

	[particles.dotStreaks]
		#Regular-parry spark debris amount as a percentage of 100 debris sparks. Zero disables regular-parry spark debris.
		# Default: 6
		# Range: 0 ~ 100
		baseIntensity = 6
		#Particle size. Zero hides this particle type.
		# Default: 100
		# Range: 0 ~ 400
		size = 100
		#How long particles last.
		# Default: 12
		# Range: 1 ~ 80
		lifetimeTicks = 30
		#Extra percentage of the selected debris amount per intercepted damage point. Zero disables scaling. Flying Sparks and Spark Debris share the burst and active budgets.
		# Default: 2
		# Range: 0 ~ 100
		damageScaling = 2
		#Color of spark debris.
		# Default: 16766124
		# Range: 0 ~ 16777215
		baseColor = 16777215
		#Show this particle effect.
		# Default: 1
		# Range: 0 ~ 1
		enabled = 1

	[particles.bloom]
		#Add colored glow around parry particles.
		# Default: 1
		# Range: 0 ~ 1
		enabled = 1
		#Brightness of the glow around particles.
		# Default: 20
		# Range: 0 ~ 300
		strength = 20
		#How far the glow spreads around particles.
		# Default: 55
		# Range: 25 ~ 300
		spread = 55
		#How colorful the glow is. Zero makes it grayscale.
		# Default: 100
		# Range: 0 ~ 200
		saturation = 100
		#Brightness of particles and the bloom they produce.
		# Default: 50
		# Range: 0 ~ 300
		brightness = 50

	[shieldReactions.parry]
		#Reaction lifetime in ticks. 20 ticks = one second.
		# Default: 4
		# Range: 1 ~ 40
		duration = 4
		#Reaction control. 100% retains the default effect; 0 disables this component.
		# Default: 100
		# Range: 0 ~ 200
		shake = 100
		#Reaction control. 100% retains the default effect; 0 disables this component.
		# Default: 1
		# Range: 0 ~ 1
		enabled = 1
		#Reaction control. 100% retains the default effect; 0 disables this component.
		# Default: 100
		# Range: 0 ~ 200
		expansion = 100
		#Reaction control. 100% retains the default effect; 0 disables this component.
		# Default: 100
		# Range: 0 ~ 200
		flash = 100

	[shieldReactions.perfect]
		#Reaction lifetime in ticks. 20 ticks = one second.
		# Default: 9
		# Range: 1 ~ 40
		duration = 9
		#Reaction control. 100% retains the default effect; 0 disables this component.
		# Default: 100
		# Range: 0 ~ 200
		shake = 100
		#Reaction control. 100% retains the default effect; 0 disables this component.
		# Default: 100
		# Range: 0 ~ 200
		echo = 100
		#Reaction control. 100% retains the default effect; 0 disables this component.
		# Default: 1
		# Range: 0 ~ 1
		enabled = 1
		#Reaction control. 100% retains the default effect; 0 disables this component.
		# Default: 100
		# Range: 0 ~ 200
		expansion = 100
		#Reaction control. 100% retains the default effect; 0 disables this component.
		# Default: 100
		# Range: 0 ~ 200
		flash = 100

	[shieldReactions.recharge]
		#Reaction lifetime in ticks. 20 ticks = one second.
		# Default: 6
		# Range: 1 ~ 40
		duration = 6
		#Reaction control. 100% retains the default effect; 0 disables this component.
		# Default: 1
		# Range: 0 ~ 1
		enabled = 1
		#Reaction control. 100% retains the default effect; 0 disables this component.
		# Default: 100
		# Range: 0 ~ 200
		expansion = 100
		#Reaction control. 100% retains the default effect; 0 disables this component.
		# Default: 100
		# Range: 0 ~ 200
		flash = 100

	[shieldReactions.block]
		#Reaction lifetime in ticks. 20 ticks = one second.
		# Default: 5
		# Range: 1 ~ 40
		duration = 5
		#Reaction control. 100% retains the default effect; 0 disables this component.
		# Default: 100
		# Range: 0 ~ 200
		shake = 100
		#Reaction control. 100% retains the default effect; 0 disables this component.
		# Default: 100
		# Range: 0 ~ 200
		echo = 100
		#Reaction control. 100% retains the default effect; 0 disables this component.
		# Default: 1
		# Range: 0 ~ 1
		enabled = 1
		#Reaction control. 100% retains the default effect; 0 disables this component.
		# Default: 100
		# Range: 0 ~ 200
		expansion = 100
		#Reaction control. 100% retains the default effect; 0 disables this component.
		# Default: 100
		# Range: 0 ~ 200
		flash = 100

	[shieldReactions.guardBreak]
		#Reaction lifetime in ticks. 20 ticks = one second.
		# Default: 5
		# Range: 1 ~ 40
		duration = 5
		#Reaction control. 100% retains the default effect; 0 disables this component.
		# Default: 100
		# Range: 0 ~ 200
		shake = 100
		#Reaction control. 100% retains the default effect; 0 disables this component.
		# Default: 100
		# Range: 0 ~ 200
		echo = 100
		#Reaction control. 100% retains the default effect; 0 disables this component.
		# Default: 1
		# Range: 0 ~ 1
		enabled = 1
		#Reaction control. 100% retains the default effect; 0 disables this component.
		# Default: 100
		# Range: 0 ~ 200
		expansion = 100
		#Reaction control. 100% retains the default effect; 0 disables this component.
		# Default: 100
		# Range: 0 ~ 200
		flash = 100

[animation]
	#Punchy's walking and sprint arm animations were automatically disabled once. You may re-enable them in Punchy's menu; Mallard Guard will not override later edits.
	punchyMovementDefaultsApplied = true
	#Show the simple blocking pose on yourself and other guarding players and humanoid mobs. Off hides this pose for everyone on your client; server guard mechanics do not change.
	thirdPersonGuardPose = true
	#Use the simple first-person weapon pose when Punchy integration is disabled. It also serves as the fallback when Punchy is unavailable. Shields use their own pose.
	firstPersonGuardPose = true
	#Whether the automatic Shield Expansion Item Only Mode notice has appeared on this client.
	shieldExpansionNoticeShown = false
	#Whether the Simply Swords keybind notice has already appeared in chat on this client.
	simplySwordsNoticeShown = false
