["Celestial Parthenon"]
	# Use datapack biome, start_height and placement values instead of the config below. Enabled and dimension restrictions
	# still apply
	# 
	# Default: false
	# 
	# [!] Requires game restart to take effect.
	PARTHENON_USE_DATAPACK_SETTINGS = false
	# Number of elite harpies spawned in the second wave
	# 
	# Default: 1
	# Range: 0 ~ 64
	PARTHENON_SECOND_WAVE_ELITE_HARPIES = 1
	# Whether Celestial Parthenons generate naturally
	# 
	# Default: true
	# 
	# [!] Requires game restart to take effect.
	PARTHENON_GENERATION_ENABLED = true
	# Maximum generation Y, where the height range is restricted to the dimension's build limits
	# 
	# Default: 190
	# Range: -2032 ~ 2031
	# 
	# [!] Requires game restart to take effect.
	PARTHENON_MAX_HEIGHT = 190
	# Comma-separated biome ids or biome tags. Use * for all biomes, or leave empty to use the structure's datapack biomes
	# 
	# Default:
	# 
	# [!] Requires game restart to take effect.
	PARTHENON_BIOMES = ""
	# Placement region size in chunks (24 chunks = 384 blocks). Larger values makes the structure spawning rarer
	# 
	# Default: 24
	# Range: 1 ~ 4096
	# 
	# [!] Requires game restart to take effect.
	PARTHENON_SPACING = 24
	# Number of regular harpies spawned in the second wave
	# 
	# Default: 2
	# Range: 0 ~ 64
	PARTHENON_SECOND_WAVE_HARPIES = 2
	# Number of regular harpies spawned in the first wave
	# 
	# Default: 2
	# Range: 0 ~ 64
	PARTHENON_FIRST_WAVE_HARPIES = 2
	# Comma-separated dimension ids (minecraft:overworld, parallax:sere, etc.) allowed for natural generation. Use * for all
	# dimensions, or leave empty to allow none. Biomes and height must also be suitable
	# 
	# Default: minecraft:overworld
	# 
	# [!] Requires game restart to take effect.
	PARTHENON_DIMENSIONS = "minecraft:overworld"
	# Minimum generation Y, where the height range is restricted to the dimension's build limits
	# 
	# Default: 155
	# Range: -2032 ~ 2031
	# 
	# [!] Requires game restart to take effect.
	PARTHENON_MIN_HEIGHT = 155
	# Minimum separation between placement regions in chunks
	# 
	# Default: 8
	# Range: 0 ~ 4095
	# 
	# [!] Requires game restart to take effect.
	PARTHENON_SEPARATION = 8
	# Chance of attempting generation in each placement region (1 = 100%, 0 = disabled)
	# 
	# Default: 1.0
	# Range: 0.0 ~ 1.0
	# 
	# [!] Requires game restart to take effect.
	PARTHENON_GENERATION_CHANCE = 1.0

