#Emerald cost of the order terminal from a wandering trader.
# Default: 48
# Range: 1 ~ 64
terminalPrice = 48
#Maximum purchases of the terminal offer per wandering trader.
# Default: 1
# Range: 1 ~ 16
terminalMaxUses = 1
#Random offers shown per unlocked tier. The prototype supports up to 20.
# Default: 20
# Range: 1 ~ 20
offersPerTier = 20
#Minecraft days before a player's deterministic catalog changes.
# Default: 6
# Range: 1 ~ 365
catalogRefreshDays = 6
#Minecraft days before used offers restock.
# Default: 3
# Range: 1 ~ 365
restockDays = 3
#Safety cap for one shift-click batch purchase.
# Default: 64
# Range: 1 ~ 256
maximumShiftClickTrades = 64
#Minimum random delivery delay in seconds, for purchases and sale payments.
# Default: 5
# Range: 3 ~ 60
deliveryMinSeconds = 5
#Maximum random delivery delay in seconds. Reversed bounds are accepted.
# Default: 15
# Range: 3 ~ 60
deliveryMaxSeconds = 15
#Personal cooldown in Minecraft days between trade-crate sales.
# Default: 3
# Range: 1 ~ 365
saleCooldownDays = 3

[worldgen]
	#Whether the order board can generate as part of supported villages.
	spawnInVillages = true
	#Chance, in percent, that a supported village attempts to generate one order board.
	#The jigsaw system can still reject the piece when terrain or available space does not fit.
	# Default: 66.6
	# Range: 0.0 ~ 100.0
	villageSpawnChancePercent = 66.6

	[worldgen.integrations]
		#Enable Luki's Grand Capitals 1.1.3 village integration.
		lukisGrandCapitals = true
		#Enable optional Towns and Towers village integration when that mod is installed.
		townsAndTowers = true
		#Enable optional Repurposed Structures village integration when that mod is installed.
		repurposedStructures = true

[progression]
	#Total accumulated XP required for tiers 1 through 5.
	#Enter exactly five strictly increasing integers; the first must be 0.
	#Invalid sequences fall back to [0, 75, 350, 900, 1700] and log a warning.
	#Existing player XP is preserved. Restart the world/server to apply changes.
	tierXpThresholds = [0, 75, 350, 900, 1700]

[trades]
	#Exclude all professions belonging to these mod namespaces from the order catalog.
	#Example: ["morevillagers"]. Empty means no mod namespaces are excluded.
	#This does NOT remove another mod's trades added to vanilla professions.
	#Real villager trades are unchanged. Restart the world/server to apply changes.
	excludedMods = []
	#Exclude specific profession registry IDs from the order catalog before offers are generated.
	#Example: ["minecraft:cartographer", "immersiveengineering:engineer"].
	#Empty means no individual professions are excluded. Real villagers are unaffected.
	#Use merchant_orders:custom to exclude the custom terminal trade group.
	#Available IDs are written to config/merchant_orders-professions.txt on server startup.
	#Use lowercase namespace:path IDs. Restart the world/server to apply changes.
	excludedProfessions = []
