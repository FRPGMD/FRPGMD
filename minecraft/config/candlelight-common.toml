#Table Sets, courses and the dinner menu.
[Dinner]
	#Food eaten from a Table Set fills you up by this multiplier. 1.0 = no bonus.
	# Default: 1.3
	# Range: 1.0 ~ 3.0
	tableSetFoodBonus = 1.3
	#Food bonus from a Table Set while wearing a full Suit or Evening Dress. 1.0 = no bonus.
	# Default: 1.5
	# Range: 1.0 ~ 3.0
	elegantFoodBonus = 1.5
	#Extra Well Served for every Table Setting, in ticks. 20 ticks = 1 second.
	# Default: 1200
	# Range: 0 ~ 12000
	wellServedTicksPerCourse = 1200
	#Longest Well Served you can get from a Table Set, in ticks. 20 ticks = 1 second.
	# Default: 12000
	# Range: 0 ~ 72000
	maxWellServedTicks = 12000
	#Starter, main course and dessert in a row give a bonus.
	enableDinnerMenu = true
	#Extra Well Served and Refreshed for a full menu, in ticks. 20 ticks = 1 second.
	# Default: 6000
	# Range: 0 ~ 72000
	menuBonusTicks = 6000
	#Longest Well Served you can get from a full menu, in ticks. 20 ticks = 1 second.
	# Default: 18000
	# Range: 0 ~ 72000
	maxMenuWellServedTicks = 18000
	#How long you may wait between two courses, in ticks. 20 ticks = 1 second.
	# Default: 6000
	# Range: 200 ~ 72000
	menuMaxTicksBetweenCourses = 6000
	#A lit candle or lamp next to a Table Set counts as a Table Setting.
	enableTableLights = true
	#Radius in blocks in which a light counts for a Table Set.
	# Default: 1
	# Range: 1 ~ 4
	tableLightRadius = 1
	#Drinks can be poured into the glasses of a Table Set.
	enableTableDrinks = true
	#How many lines fit on a Table Sign.
	# Default: 8
	# Range: 1 ~ 12
	tableSignMaxLines = 8

#Villagers who come to dinner at your Table Sets.
["Dinner Guests"]
	#Villagers may eat dishes from Table Sets in the evening.
	enableDinnerGuests = true
	#Chance in percent per check that a villager comes to the table.
	# Default: 30
	# Range: 0 ~ 100
	dinnerGuestChance = 30
	#Radius in blocks in which villagers notice a served dish.
	# Default: 16
	# Range: 4 ~ 64
	dinnerGuestRange = 16
	#Every how many ticks a Table Set looks for a guest. 20 ticks = 1 second.
	# Default: 200
	# Range: 20 ~ 6000
	dinnerGuestInterval = 200
	#Time of day from which villagers come to dinner. 0 = sunrise, 6000 = noon, 12000 = sunset, 18000 = midnight.
	# Default: 9000
	# Range: 0 ~ 24000
	dinnerStart = 9000
	#Time of day until which villagers come to dinner. 0 = sunrise, 6000 = noon, 12000 = sunset, 18000 = midnight.
	# Default: 12000
	# Range: 0 ~ 24000
	dinnerEnd = 12000
	#Nitwits eat the dish but give no discount.
	nitwitsEat = true
	#Discount in percent on all trades after the dinner.
	# Default: 10
	# Range: 0 ~ 100
	dinnerDiscountPercent = 10
	#How long the discount lasts, in ticks. 24000 ticks = 1 day.
	# Default: 24000
	# Range: 1200 ~ 240000
	dinnerDiscountTicks = 24000
	#Only the player who served the dish gets the discount.
	discountOnlyHost = false

#Set bonuses of the Chef's Outfit, Suit and Evening Dress.
[Clothing]
	#Wearing the full Chef's Outfit gives a set bonus.
	enableChefSetBonus = true
	#Chance in percent of an extra portion from the Cooking Pan and Cooking Pot while wearing the full Chef's Outfit.
	# Default: 25
	# Range: 0 ~ 100
	chefSetExtraPortionChance = 25
	#Wearing a full Suit or Evening Dress gives a set bonus.
	enableElegantSetBonus = true
	#Clothing shows its set pieces and bonus in the item tooltip.
	showSetBonusTooltips = true
	#Chance in percent that a zombie spawns with a Cooking Hat.
	# Default: 3
	# Range: 0 ~ 100
	zombieCookingHatChance = 3

#Info tooltips that appear when looking at a block. Only affects your own screen.
["Info Tooltips"]
	#Shows an info tooltip when looking at a Table Set.
	showTableSetInfo = true
	#Shows an info tooltip when looking at a Side Table.
	showSideTableInfo = true
	#Shows an info tooltip when looking at a Table Sign.
	showTableSignInfo = true

#Fine-tuning of the effects.
[Effects]

	[Effects."Well Served Effect"]
		#Your hunger never drops below this while Well Served is active. 2 points = 1 drumstick.
		# Default: 8
		# Range: 0 ~ 20
		wellServedFoodFloor = 8

	[Effects."Refreshed Effect"]
		#How many harvests Refreshed covers.
		# Default: 10
		# Range: 1 ~ 64
		refreshedMaxCharges = 10

	[Effects."Gold Ring Effect"]
		#Wearing the Gold Ring gives Luck.
		enableRingLuck = true
		#Luck level of the Gold Ring. 0 = Luck I.
		# Default: 1
		# Range: 0 ~ 4
		ringLuckAmplifier = 1

	[Effects."Completionist Banner Effect"]
		#Players near a placed Completionist Banner get its effect.
		bannerGiveEffect = true
		#Radius in blocks of the Completionist Banner effect.
		# Default: 8
		# Range: 1 ~ 32
		bannerEffectRadius = 8
		#Level of the Completionist Banner effect. 0 = level I.
		# Default: 0
		# Range: 0 ~ 4
		bannerEffectAmplifier = 0

#Sounds and particles.
[Misc]
	#Plays a soft sound while dabbing with a Napkin.
	enableNapkinSound = true
	#Freshly served dishes on a Table Set steam for a while.
	enableDishSteam = true
	#How long freshly served dishes steam, in ticks. 20 ticks = 1 second.
	# Default: 2400
	# Range: 200 ~ 12000
	dishSteamTicks = 2400

