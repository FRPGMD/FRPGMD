#many configs for modpack creators!
#
#🔹 HACKERS 'N SLASHERS CONFIGS 🔹
#
#⚙ Module Toggles
["Module Toggles"]
	enable_stealth_system = true
	enable_parry_system = true
	enable_bash_system = true

#────────────────────────────────────────────────────────────────
#
#⚔ Critical Hit Settings
["Critical Hit Settings"]
	disable_default_critical = true
	enable_headshot = true
	enable_riposte = true
	enable_sneak_attack = true

#────────────────────────────────────────────────────────────────
#
#⚙ Auto-generated Weapon-specific Attributes
["Auto-generated Weapon-specific Attributes"]
	enable_autogenerated_critical_multiplier = true
	enable_autogenerated_armor_pen_attributes = true
	enable_autogenerated_stagger_attributes = true

#────────────────────────────────────────────────────────────────
#
#⚔ Aggro Settings
#
#• Damage dealt/status/absorbed = threat weights
#• Aggro leader = initial attacker bonus
#
#The higher the value, the more this parameter will be effective in
#pulling a mob aggro
#
#⚠ Healing done applies to each HP restored
["Aggro Settings"]
	# Default: 2.0
	# Range: 0.0 ~ 100.0
	aggro_leader_multiplier = 2.0
	# Default: 5.0
	# Range: 0.0 ~ 100.0
	taunt_applied_weight = 5.0
	# Default: 0.5
	# Range: 0.0 ~ 100.0
	damage_absorbed_weight = 0.5
	# Default: 1.0
	# Range: 0.0 ~ 100.0
	damage_dealt_weight = 1.0
	# Default: 0.25
	# Range: 0.0 ~ 100.0
	healing_done_weight = 0.25
	# Default: 1.0
	# Range: 0.0 ~ 100.0
	effect_applied_weight = 1.0

	#⚔ Threat generation values
	#
	#• Tick decay = threat fade rate
	["Aggro Settings"."Threat generation values"]
		# Default: 0.01
		# Range: 0.0 ~ 1.0
		default_per_tick_threat_decay = 0.01

#────────────────────────────────────────────────────────────────
#
#👁 AI Settings
["AI Settings"]
	attractive_sounds = ["minecraft:block.wooden_door.open", "minecraft:block.wooden_door.close", "minecraft:block.iron_door.open", "minecraft:block.iron_door.close", "minecraft:block.trapdoor.open", "minecraft:block.trapdoor.close", "minecraft:block.fence_gate.open", "minecraft:block.fence_gate.close", "minecraft:block.lever.click", "minecraft:block.stone_button.click_on", "minecraft:block.stone_button.click_off", "minecraft:block.wooden_button.click_on", "minecraft:block.wooden_button.click_off", "minecraft:block.chest.open", "minecraft:block.chest.close", "minecraft:block.ender_chest.open", "minecraft:block.ender_chest.close"]

#────────────────────────────────────────────────────────────────
#
#🛡️ Parry System
#
#Modes: (DEFAULT, MISSING-HEALTH, DISABLED)
#⚠ DISABLED disables stun and riposte
["Parry System"]
	parry_stagger_mode = "DEFAULT"
	# Default: 0
	# Range: 0 ~ 1000
	base_parry_cooldown_reduction = 0
	should_parry_override_usable_items = false
	should_parry_deflect_projectiles = true
	should_parry_fail = true

#────────────────────────────────────────────────────────────────
#
#🛡️ Bash System
#(cooldown ≥ 10 ticks)
["Bash System"]
	# Default: 0.25
	# Range: 0.0 ~ 10.0
	base_bash_strength = 0.25
	# Default: 60
	# Range: 0 ~ 1200
	bash_slowness_duration_ticks = 60
	should_bash_apply_slowness = true
	should_bash_deal_damage = true

#────────────────────────────────────────────────────────────────
#
#⚙ Miscellaneous
[Miscellaneous]
	enable_custom_critical_sounds = true
